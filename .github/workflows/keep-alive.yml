name: Keep Supabase Alive

on:
  schedule:
    # Todos los días a las 04:00 UTC
    - cron: '0 4 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping keep-alive endpoint
        run: |
          curl \
            -H "x-keep-alive-secret: ${{ secrets.KEEP_ALIVE_SECRET }}" \
            https://bicipop.vercel.app/api/keep-alive
